[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pokerfast"
version = "0.2.0"
description = "Fast hold'em hand evaluation, a lean 6-max NLHE engine, and runtime accelerators for pokerkit"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["poker", "holdem", "hand-evaluator", "equity", "pokerkit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# pokerkit is needed for `pokerfast.patches`, and for the differential tests
# that are the correctness argument for the engine and the evaluator. The core
# `eval7` / `FastHand` path does not import it except to fall back.
pokerkit = ["pokerkit==0.7.3"]
test = ["pokerkit==0.7.3", "pytest>=7"]

[project.urls]
Source = "https://github.com/wesboyt/pokerfast"
Issues = "https://github.com/wesboyt/pokerfast/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.15"
cmake.source-dir = "native"
cmake.build-type = "Release"
wheel.packages = ["src/pokerfast"]
# The native library is loaded with ctypes and never links libpython, so one
# wheel per OS/CPU serves every CPython (free-threaded included) and PyPy:
# tag it py3-none-<platform> instead of cpXY-cpXY-<platform>.
wheel.py-api = "py3"
# The sdist must carry OMPEval's sources (a submodule) so it can build
# without git; its own repository metadata and demo programs are not needed.
sdist.include = ["vendor/OMPEval/omp", "vendor/OMPEval/libdivide",
                 "vendor/OMPEval/LICENSE*.txt"]
sdist.exclude = ["vendor/OMPEval/.git", "vendor/OMPEval/*.cpp",
                 "vendor/OMPEval/ttest", "dist", "benchmarks/*.json"]
wheel.license-files = ["LICENSE", "NOTICE", "vendor/OMPEval/LICENSE.txt",
                       "vendor/OMPEval/LICENSE-libdivide.txt"]

# Build a pure-Python fallback wheel (py3-none-any, no native library) with
#   python -m build --wheel -C wheel.cmake=false -C wheel.platlib=false
# pip prefers a platform wheel, so only platforms without one get this.

[tool.cibuildwheel]
# py3-none wheels are Python-independent: build each platform ONCE.
build = "cp312-*"
skip = ["*-musllinux_i686", "*-manylinux_i686", "*-win32"]
test-requires = ["pytest", "pokerkit==0.7.3"]
test-command = "pytest -q {project}/tests"
environment = { POKERFAST_REQUIRE_NATIVE = "1", POKERFAST_TEST_INSTALLED = "1" }

[tool.cibuildwheel.macos]
# The earliest macOS each architecture supports well; widens compatibility.
environment = { POKERFAST_REQUIRE_NATIVE = "1", POKERFAST_TEST_INSTALLED = "1", MACOSX_DEPLOYMENT_TARGET = "10.13" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# The differential tests are the point, so make a missing pokerkit loud rather
# than quietly reducing the suite to the trivial cases.
addopts = "-ra"
